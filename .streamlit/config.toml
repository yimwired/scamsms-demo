# Same colours as the brochure; Streamlit's default font, so nothing extra to load at the booth.
[client]
toolbarMode = "viewer"  # no Deploy button or dev menu in front of visitors

[theme]
base = "light"
primaryColor = "#17345f"            # brochure navy: buttons, active tab
backgroundColor = "#f3f6fb"
secondaryBackgroundColor = "#eef3fa"
textColor = "#1d2330"
linkColor = "#2a78d6"
borderColor = "#c9d6ea"
showWidgetBorder = true
baseRadius = "10px"
# The Thai fallback font has no 600 weight, so a 600 heading mixes bold Thai with semibold digits.
headingFontWeights = 700
# Brochure palette for alerts, badges and :color[] markdown
blueColor = "#2a78d6"
blueTextColor = "#17345f"
blueBackgroundColor = "#e8eefa"
redColor = "#d63b3b"
greenColor = "#1a7f4b"
greenTextColor = "#1a7f4b"
greenBackgroundColor = "#e6f4ec"
orangeColor = "#eb6834"
orangeTextColor = "#b7791f"         # brochure amber for "ยังไม่ถึง", kept apart from the red verdict
dataframeHeaderBackgroundColor = "#e8eefa"
dataframeBorderColor = "#c9d6ea"
